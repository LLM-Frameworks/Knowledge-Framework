name: Claim Scout
type: method
status: installed
purpose: Help veterans evaluate VA disability claims by discovering potential conditions, mapping evidence, identifying gaps, and building source-traced evidence without fabrication.
triggers:
  keywords:
    - VA claim
    - disability claim
    - service connection
    - C&P exam
    - nexus
    - secondary condition
    - presumptive
    - buddy statement
    - rating decision
    - Blue Button
    - DD-214
    - evidence gap
  ideas:
    - when reviewing VA medical or service records
    - when preparing for a C&P exam
    - when looking for secondary or presumptive claims
    - when building or checking a claim tracker
    - when a veteran needs help understanding strengths and gaps in evidence
    - when drafting impact or buddy statements that require source quotes
how_to_use: |
  1. Start with START_HERE.md (upload or paste).
  2. Resolve or generate the Tracker.
  3. Run Scout.md for discovery, gap analysis, and pattern scans.
  4. Follow the Next Action pointers into Build_Evidence.md.
  5. Update only the tracker status columns after each step.
  Rules that never change: no source → no fact; no medical source → no AI-generated medical opinion; never invent symptoms, thresholds, or nexus language.
depends_on: []
epistemic_status: developing
version: "0.4"
