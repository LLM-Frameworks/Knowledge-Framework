name: NFL Contender Rating
type: method
status: nominated
purpose: Rate NFL contenders from schedule-adjusted strength (not pure win%), trend, path, and context; optional companion weekly score predictor.
triggers:
  keywords:
    - NFL
    - contender
    - power ranking
    - strength of schedule
    - playoff
    - Steelers
    - Bills
    - week predictions
  ideas:
    - when ranking who actually belongs among contenders
    - when a full-season rating diverges from recent form
    - when building or checking a weekly prediction card
    - when Briefing needs an NFL lane summary
how_to_use: |
  1. Read method.md (formula, four steps, context checklist, what was rejected).
  2. Rating is the core product: base = raw win%; adjust wins/losses by opponent adjusted records.
  3. Always run Step 4 context (QB, injuries, pedigree, home/road extremes, division-built record) — never skip.
  4. Optional companion: predict-week.py + week-N-data.json for score lines (separate machine).
  5. Live data and scripts stay in Settings/ or the working Drive folder until promoted.
depends_on: []
epistemic_status: developing
version: "0.1"
